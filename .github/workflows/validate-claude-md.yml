name: Validate CLAUDE.md

on:
  pull_request:
    paths:
      - "**/CLAUDE.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/validate-claude-md.yml"
  push:
    branches:
      - main
    paths:
      - "**/CLAUDE.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/validate-claude-md.yml"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: |
            CLAUDE.md
            **/CLAUDE.md
